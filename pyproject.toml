[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.7",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
benchmark = "benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
